# train_luca_song_v4.yaml — luca_song LoRA 学習設定
# train_v4_small_lora_speaker.yaml の実績レシピから scripts/new_speaker_lora_config.py で生成
# train_v4_small_lora_speaker.yaml — Irodori-TTS-v4-Small 話者 LoRA テンプレート（小データ用）
#
# model ブロックは upstream の configs/train_v4_small_lora.yaml と同一。
# train ブロックは projects/mamimi/train_mamimi_v6.yaml 系の小データ実績レシピ
# （batch_size 4 / max_steps 3000 / lora_r 32・alpha 64 / diffusion_attn_mlp）に寄せてある。
#
# 話者別 config はこれをテンプレートに生成する:
#   uv run python scripts/new_speaker_lora_config.py \
#       --speaker asuna --version 4 --template configs/train_v4_small_lora_speaker.yaml
#
# ⚠ wandb_project / wandb_run_name はジェネレータの置換対象のため
#   テンプレート既定値（irodori-tts-mamimi / mamimi-v6）のままにしてある。
model:
  # ── Core architecture (v4-Small, 766M) ──
  latent_dim: 32
  latent_patch_size: 1
  text_vocab_size: 102400
  text_tokenizer_repo: sbintuitions/modernbert-ja-310m
  text_encoder_revision: 77675fc96a7e445e982e2ba90246b816efc74ec6
  text_encoder_type: pretrained
  text_add_bos: true
  pretrained_projector_type: residual_mlp
  pretrained_projector_hidden_ratio: 2.0
  pretrained_projector_dropout: 0.0
  model_dim: 1280
  num_layers: 12
  num_heads: 20
  mlp_ratio: 2.875
  speaker_mlp_ratio: 2.6
  text_dim: 512
  speaker_dim: 768
  speaker_layers: 8
  speaker_heads: 12
  speaker_patch_size: 4
  timestep_embed_dim: 512
  adaln_rank: 192

  # ── caption + speaker + duration predictor ──
  use_caption_condition: true
  use_speaker_condition: true
  caption_vocab_size: 102400
  caption_tokenizer_repo: sbintuitions/modernbert-ja-310m
  caption_add_bos: true
  caption_dim: 512
  use_duration_predictor: true
  duration_aux_dim: 14
  duration_hidden_dim: 1024
  duration_layers: 3
  duration_dropout: 0.1
  duration_attention_heads: 8
  duration_architecture: token_sum_dual_adarn_zero_no_aux
  duration_token_init_frames: 9.0
  duration_speaker_fusion: adarn_zero
  duration_caption_fusion: adarn_zero
  duration_caption_pooling: masked_mean

train:
  train_mode: rf

  # ── Data (小データ: 90〜150 セグメント想定) ──
  batch_size: 4
  gradient_accumulation_steps: 4
  num_workers: 4
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 2
  dataloader_cuda_prefetch: true
  length_bucket_enabled: false
  max_latent_steps: 750
  max_text_len: 256
  max_caption_len: 512

  # ── v4: 長尺参照（最大120秒） ──
  ref_min_seconds: 1.0
  ref_max_seconds: 120.0

  # ── variable-length training ──
  fixed_target_latent_steps:
  fixed_target_full_mask: false
  rf_loss_mode: utterance_mean

  # ── Precision and optimization ──
  allow_tf32: true
  compile_model: false
  precision: bf16
  optimizer: adamw
  learning_rate: 0.00005
  pretrained_text_encoder_learning_rate: 0.00001
  weight_decay: 0.01

  # ── WSD schedule ──
  lr_scheduler: wsd
  warmup_steps: 200
  stable_steps: 2000
  min_lr_scale: 0.01
  max_steps: 3000

  # ── Condition dropout (enables CFG at inference) ──
  text_condition_dropout: 0.1
  speaker_condition_dropout: 0.1
  caption_condition_dropout: 0.1
  timestep_stratified: true

  # ── Duration predictor joint training ──
  duration_loss_weight: 0.1
  duration_backprop_to_condition: false
  duration_speaker_dropout: 0.1
  duration_caption_dropout: 0.1
  duration_huber_delta: 0.1

  # ── Logging and checkpoints ──
  log_every: 50
  save_every: 300
  checkpoint_best_n: 5
  valid_ratio: 0.05
  valid_every: 300

  # ── W&B ──
  wandb_enabled: false
  wandb_project: irodori-tts-luca-song
  wandb_run_name: luca-song-v4

  # ── LoRA (小データ実績値) ──
  lora_enabled: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_bias: none
  lora_target_modules: diffusion_attn_mlp
  lora_modules_to_save: auto

  seed: 42
  ddp_find_unused_parameters: false
