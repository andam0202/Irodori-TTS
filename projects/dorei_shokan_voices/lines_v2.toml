# 部屋（プレイの種類）ごとの台本 v2。各キャラ（voice_matrix の 36 セル）共通、1 種類 7 行。
# 台詞は無し（2026-09-25 ユーザー指示）。内訳: 吐息1・弱い喘ぎ2・中くらいの喘ぎ1・強い喘ぎ2・絶頂1、すべて擬音のみ。
# ゲームでは部屋のプレイ種類の行からランダムに流す（同じ行の連続は避ける）。climax = true の行は行為の終わりにだけ流す。
#   id             … <play>_<種別><nn>（b=吐息 m=喘ぎ c=絶頂。m05 は中くらいの喘ぎ）
#   play           … wall / chair / bed / sofa / kingbed / whip / horse / pleasure
#   kind           … breath / moan（参照音声はどちらもセルの喘ぎ参照）
#   level          … soft（弱い）/ mid（中くらい）/ hard（強い）
#   climax         … true なら絶頂行
#   style          … セルの caption の後ろに足す演技（口調はセルの caption が担う）
#   duration_scale … 喘ぎ・吐息は 1.3
# 登場キャラは全員成人。

[plays]
wall = { name = "壁尻", direction = "壁越しでくぐもる・顔が見えない不安と羞恥、押し殺した声" }
chair = { name = "椅子（対面座位）", direction = "密着して甘える、耳元の近い声" }
bed = { name = "ベッド（正常位）", direction = "素直で甘い、見つめ合う優しさ" }
sofa = { name = "ソファ（騎乗位）", direction = "自分から動く能動的な声、息が弾む" }
kingbed = { name = "高級ベッド", direction = "濃厚で長く、何度も高まる" }
whip = { name = "調教ムチ", direction = "打たれる痛みの短い悲鳴と、だんだん甘さが混じる" }
horse = { name = "調教木馬", direction = "揺れに耐える苦しげな声、途切れ途切れ" }
pleasure = { name = "快楽拷問", direction = "焦らされて懇願する、我慢できずに高まる" }

