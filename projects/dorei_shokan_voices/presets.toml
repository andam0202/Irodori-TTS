# 奴隷娼館リメイク（Godot）の「閉じた部屋から漏れ聞こえる声」のボイスプリセット。
# 登場キャラは全員成人。こもった音は Godot 側のローパスで作るので、ここでは素の声を作る。
#
# 各プリセット:
#   id       … ファイル名・Godot 側のキー（英小文字）
#   name     … 表示名
#   caption  … VoiceDesign 用の声質説明（自然文）。台本行の style がこの後ろに足される
#   seed     … 採用した seed（オーディションで決める。0 = 未決）
#   ref_wav  … 採用した参照音声（リポジトリ相対。"" = 未決）。
#              `build_voices.py adopt <id> <seed>` で seed と一緒に書き込まれる
#
# 段階1（オーディション）は caption のみ（no-ref）で [audition].seeds を総当たりし、
# 段階2（build）は ref_wav + caption + seed で lines.toml 全本を作る。

checkpoint = "models/Irodori-TTS-v4.1-Small/model.safetensors"

[audition]
seeds = [101, 202, 303, 404, 505, 606]
# lines.toml の id。普通の台詞 1 本 + mid の喘ぎ 1 本。先頭の台詞が adopt 時の参照音声になる
lines = ["talk", "mid_m01"]

[[preset]]
id = "onesan"
name = "お姉さん（大人の余裕）"
caption = "落ち着いた艶のある中音域の声の、大人の女性。余裕があり、相手を甘やかすように柔らかく微笑みながら話す。"
seed = 0
ref_wav = ""

