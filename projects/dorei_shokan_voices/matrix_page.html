<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奴隷娼館 声の割り当て</title>
<style>
:root{--bg:#141418;--fg:#e8e6e3;--mut:#8f8b85;--card:#1f1f25;--card2:#26262e;--line:#33333c;
--acc:#e07a9b;--ok:#3f8f55;--warn:#c9a23a;--sel:#6a8cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
font:12px/1.35 "Yu Gothic UI","Hiragino Sans",sans-serif}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0}
button{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:4px;
padding:4px 9px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}button.primary{background:var(--acc);color:#1a1016;border-color:var(--acc);font-weight:bold}
#status{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}
#status.dirty{color:var(--warn)}
main{display:grid;grid-template-columns:1fr 330px;min-height:0}
#gridwrap{overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;padding:4px}
thead th{position:sticky;top:0;background:var(--card2);z-index:2;text-align:left}
th.race{position:sticky;left:0;background:var(--card2);z-index:1;width:150px;text-align:left}
.hname{font-size:13px;font-weight:bold}.hid{color:var(--mut);font-family:monospace;font-weight:normal;margin-left:4px}
textarea.frag{width:100%;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line);
border-radius:3px;font:11px/1.3 inherit;padding:2px 4px;margin-top:2px}
textarea.frag.changed{border-color:var(--warn)}
td.cell{background:var(--card);min-width:230px}
td.cell.selected{outline:2px solid var(--sel);outline-offset:-2px}
td.cell.dragover{background:#2a2f45}
td.cell.changed{box-shadow:inset 3px 0 0 var(--warn)}
.top{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:3px;font:inherit;padding:1px 2px}
.badge{background:var(--ok);color:#fff;border-radius:3px;padding:0 5px;font-size:11px;white-space:nowrap}
.badge.pend{background:var(--warn);color:#1a1400}
.cap{color:var(--mut);font-size:11px;margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seeds{display:flex;flex-wrap:wrap;gap:3px}
.chip{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:1px 3px}
.chip.adopted{border-color:var(--ok);background:#1d2c21}.chip.pending{border-color:var(--warn)}
.chip .n{font-family:monospace;font-weight:bold;font-size:13px}
.chip input{margin:0;width:13px;height:13px}
.play{border:0;background:none;padding:0 2px;color:var(--acc);font-size:11px;cursor:pointer}
.play.playing{color:#fff;background:var(--acc);border-radius:2px}
.nogen{color:var(--mut);font-size:10px}
aside{border-left:1px solid var(--line);overflow:auto;min-height:0;padding:6px}
aside h2{font-size:13px;margin:2px 0 6px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:5px;margin-bottom:5px;cursor:grab}
.pc:hover{border-color:var(--acc)}
.pc .top .hname{font-size:12px}
.hint{color:var(--mut);font-size:11px;margin-bottom:6px}
#toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);
padding:6px 12px;border-radius:4px;display:none;max-width:80vw;white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>声の割り当て（種族×体型）</h1>
  <button class="primary" id="save">保存</button>
  <button id="copyAud">未生成セルのオーディションコマンドをコピー</button>
  <button id="copyAdopt">採用コマンドをコピー</button>
  <button id="reload">再読込</button>
  <span id="status">読み込み中…</span>
</header>
<main>
  <div id="gridwrap"><table id="grid"></table></div>
  <aside>
    <h2>既存プリセット</h2>
    <div class="hint">セルへドラッグするか、セルをクリックして選び「選択セルへ」で割り当て。▶台＝台詞、▶喘＝喘ぎ。</div>
    <div id="presets"></div>
  </aside>
</main>
</div>
<div id="toast"></div>
<script>
const CMD = "uv run python projects/dorei_shokan_voices/build_voices.py";
let S = null;          // サーバの状態
let L = null;          // 編集中（races/bodies/cells）
let adopt = {};        // cell -> seed（未保存の採用）
let selected = null;   // 選択セル
const player = new Audio();
let playingBtn = null;

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const presetById = id => S.presets.find(p => p.id === id);
const cellDir = k => k.replace(":", "_");

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 3500);
}
async function load() {
  const r = await fetch("/api/state"); S = await r.json(); resetLocal(); render();
}
function resetLocal() {
  L = clone({races: S.matrix.races, bodies: S.matrix.bodies, cells: S.matrix.cells});
  adopt = {};
}
function isDirty() {
  const m = S.matrix;
  return Object.keys(adopt).length > 0 ||
    JSON.stringify(L.races) !== JSON.stringify(m.races) ||
    JSON.stringify(L.bodies) !== JSON.stringify(m.bodies) ||
    Object.keys(L.cells).some(k => L.cells[k].mode !== m.cells[k].mode || (L.cells[k].preset||"") !== (m.cells[k].preset||""));
}
function setStatus() {
  const st = $("#status"), d = isDirty();
  st.className = d ? "dirty" : "";
  const adopted = Object.values(S.matrix.cells).filter(c => c.seed).length;
  st.textContent = (d ? "未保存の変更あり ／ " : "保存済み ／ ") + `採用 ${adopted}/${Object.keys(S.matrix.cells).length} セル`;
}
function captionOf(k) {
  const c = L.cells[k];
  if (c.mode === "preset") { const p = presetById(c.preset); return p ? p.caption : "(プリセット未選択)"; }
  const [r, b] = k.split(":");
  return L.bodies.find(x => x.id === b).voice + L.races.find(x => x.id === r).tone;
}
// セルで聞ける seed とファイル
function seedSource(k) {
  const c = L.cells[k];
  if (c.mode === "preset") {
    const has = S.preset_audio[c.preset] || {};
    return {seeds: S.preset_seeds, has, base: `/audio/audition/${c.preset}/`};
  }
  return {seeds: S.matrix.audition_seeds, has: S.cell_audio[cellDir(k)] || {}, base: `/audio/matrix/${cellDir(k)}/`};
}
function chips(name, seeds, has, base, savedSeed, pendSeed, radio) {
  return seeds.map(s => {
    const got = has[String(s)] || [];
    const plays = S.audition_lines.map((ln, i) => got.includes(ln.id)
      ? `<button class="play" data-src="${base}seed${s}_${ln.id}.wav" title="${esc(ln.text)}">▶${i ? "喘" : "台"}</button>` : "").join("");
    const cls = pendSeed == s ? "pending" : (savedSeed == s ? "adopted" : "");
    const checked = (pendSeed ?? savedSeed) == s ? "checked" : "";
    const r = radio && got.length ? `<input type="radio" name="${esc(name)}" value="${s}" ${checked}>` : "";
    return `<span class="chip ${cls}">${r}<span class="n">${s}</span>${plays || '<span class="nogen">未生成</span>'}</span>`;
  }).join("");
}
function cellHTML(k) {
  const c = L.cells[k], saved = S.matrix.cells[k];
  const sameAssign = c.mode === saved.mode && (c.preset||"") === (saved.preset||"");
  const savedSeed = sameAssign ? saved.seed : 0;
  const src = seedSource(k);
  const opts = S.presets.map(p => `<option value="${p.id}" ${p.id === c.preset ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  let badge = "";
  if (adopt[k]) badge = `<span class="badge pend">採用予定 ${adopt[k]}</span>`;
  else if (savedSeed) badge = `<span class="badge">採用済み ${savedSeed}</span>`;
  else if (c.mode === "preset") { const p = presetById(c.preset); if (p && p.seed) badge = `<span class="badge pend">保存でプリセット採用 ${p.seed} を引継ぎ</span>`; }
  return `<div class="top">
      <select class="mode"><option value="compose" ${c.mode==="compose"?"selected":""}>compose</option><option value="preset" ${c.mode==="preset"?"selected":""}>preset</option></select>
      ${c.mode === "preset" ? `<select class="preset"><option value="">--</option>${opts}</select>` : ""}
      ${badge}</div>
    <div class="cap" title="${esc(captionOf(k))}">${esc(captionOf(k))}</div>
    <div class="seeds">${chips("adopt:" + k, src.seeds, src.has, src.base, savedSeed, adopt[k], true)}</div>`;
}
function render() {
  const g = $("#grid");
  let h = `<thead><tr><th class="race">種族 ＼ 体型</th>` + L.bodies.map(b => {
    const ch = b.voice !== S.matrix.bodies.find(x => x.id === b.id).voice ? "changed" : "";
    return `<th><span class="hname">${esc(b.name)}</span><span class="hid">${b.id}</span>
      <textarea class="frag ${ch}" rows="2" data-body="${b.id}">${esc(b.voice)}</textarea></th>`;
  }).join("") + `</tr></thead><tbody>`;
  for (const r of L.races) {
    const ch = r.tone !== S.matrix.races.find(x => x.id === r.id).tone ? "changed" : "";
    h += `<tr><th class="race"><span class="hname">${esc(r.name)}</span><span class="hid">${r.id}</span>
      <textarea class="frag ${ch}" rows="2" data-race="${r.id}">${esc(r.tone)}</textarea></th>`;
    for (const b of L.bodies) {
      const k = `${r.id}:${b.id}`, c = L.cells[k], sv = S.matrix.cells[k];
      const changed = adopt[k] || c.mode !== sv.mode || (c.preset||"") !== (sv.preset||"") ? "changed" : "";
      h += `<td class="cell ${changed} ${selected === k ? "selected" : ""}" data-k="${k}">${cellHTML(k)}</td>`;
    }
    h += `</tr>`;
  }
  g.innerHTML = h + `</tbody>`;
  // プリセット欄
  const ordered = [...S.presets].sort((a, b) => (b.round || 1) - (a.round || 1));
  $("#presets").innerHTML = ordered.map(p => `<div class="pc" draggable="true" data-p="${p.id}">
      <div class="top"><span class="hname">${esc(p.name)}</span><span class="hid">${p.id}</span>
      ${p.seed ? `<span class="badge">採用済み ${p.seed}</span>` : ""}
      <button class="assign" style="margin-left:auto">選択セルへ</button></div>
      <div class="cap" title="${esc(p.caption)}">${esc(p.caption)}</div>
      <div class="seeds">${chips("p:" + p.id, S.preset_seeds, S.preset_audio[p.id] || {}, `/audio/audition/${p.id}/`, p.seed, null, false)}</div>
    </div>`).join("");
  setStatus();
}
function assign(k, pid) {
  L.cells[k].mode = "preset"; L.cells[k].preset = pid; delete adopt[k]; render();
  toast(`${k} ← ${pid}`);
}
// ---- イベント
document.addEventListener("click", e => {
  const pb = e.target.closest(".play");
  if (pb) {
    e.stopPropagation();
    if (playingBtn === pb && !player.paused) { player.pause(); pb.classList.remove("playing"); playingBtn = null; return; }
    if (playingBtn) playingBtn.classList.remove("playing");
    player.src = pb.dataset.src; player.play(); pb.classList.add("playing"); playingBtn = pb; return;
  }
  const as = e.target.closest(".assign");
  if (as) {
    if (!selected) { toast("先に割り当てるセルをクリックして選ぶ"); return; }
    assign(selected, as.closest(".pc").dataset.p); return;
  }
  const td = e.target.closest("td.cell");
  if (td && !e.target.closest("select,input")) { selected = selected === td.dataset.k ? null : td.dataset.k; render(); }
});
player.addEventListener("ended", () => { if (playingBtn) playingBtn.classList.remove("playing"); playingBtn = null; });
document.addEventListener("change", e => {
  const t = e.target, td = t.closest("td.cell");
  if (td && t.classList.contains("mode")) {
    const c = L.cells[td.dataset.k]; c.mode = t.value;
    if (c.mode === "compose") c.preset = ""; else if (!c.preset) c.preset = S.presets[0].id;
    delete adopt[td.dataset.k]; render();
  } else if (td && t.classList.contains("preset")) {
    if (t.value) { L.cells[td.dataset.k].preset = t.value; delete adopt[td.dataset.k]; render(); }
  } else if (td && t.type === "radio") {
    const k = td.dataset.k, s = Number(t.value), sv = S.matrix.cells[k];
    if (sv.seed === s && sv.mode === L.cells[k].mode && (sv.preset||"") === (L.cells[k].preset||"")) delete adopt[k]; else adopt[k] = s;
    render();
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.race) L.races.find(x => x.id === t.dataset.race).tone = t.value;
  else if (t.dataset.body) L.bodies.find(x => x.id === t.dataset.body).voice = t.value;
  else return;
  // caption プレビューだけ更新（入力中のフォーカスを保つ）
  document.querySelectorAll("td.cell").forEach(td => { const cap = td.querySelector(".cap"); const s = captionOf(td.dataset.k); cap.textContent = s; cap.title = s; });
  t.classList.toggle("changed", true); setStatus();
});
document.addEventListener("dragstart", e => { const pc = e.target.closest(".pc"); if (pc) e.dataTransfer.setData("text/plain", pc.dataset.p); });
document.addEventListener("dragover", e => { const td = e.target.closest("td.cell"); if (td) { e.preventDefault(); td.classList.add("dragover"); } });
document.addEventListener("dragleave", e => { const td = e.target.closest("td.cell"); if (td) td.classList.remove("dragover"); });
document.addEventListener("drop", e => {
  const td = e.target.closest("td.cell"); if (!td) return; e.preventDefault();
  const pid = e.dataTransfer.getData("text/plain"); if (pid && presetById(pid)) assign(td.dataset.k, pid);
});
$("#save").onclick = async () => {
  const cells = {}; for (const k in L.cells) cells[k] = {mode: L.cells[k].mode, preset: L.cells[k].preset || ""};
  const r = await fetch("/api/save", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({races: L.races, bodies: L.bodies, cells, adopt})});
  const j = await r.json();
  if (!j.ok) { toast("保存失敗: " + j.error); return; }
  S = j.state; resetLocal(); render(); toast("保存しました\n" + j.log.join("\n"));
};
$("#reload").onclick = () => { if (!isDirty() || confirm("未保存の変更を捨てて読み直す？")) load(); };
async function copy(text, what) {
  if (!text) { toast(what + ": 対象なし"); return; }
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(what + " をコピー\n" + text);
}
$("#copyAud").onclick = () => {
  const need = Object.keys(L.cells).filter(k => {
    const c = L.cells[k], sv = S.matrix.cells[k];
    if (c.mode !== "compose" || sv.seed) return false;
    const has = S.cell_audio[cellDir(k)] || {};
    return S.matrix.audition_seeds.some(s => (has[String(s)] || []).length < S.audition_lines.length);
  });
  const note = isDirty() ? "# 断片・割り当ての変更は先に「保存」すること\n" : "";
  copy(need.length ? note + `${CMD} matrix-audition --skip-existing --cells ${need.join(",")}` : "", "オーディションコマンド");
};
$("#copyAdopt").onclick = () => {
  const lines = Object.entries(adopt).map(([k, s]) => `${CMD} matrix-adopt ${k} ${s}`);
  const adopted = Object.keys(S.matrix.cells).filter(k => S.matrix.cells[k].seed).concat(Object.keys(adopt));
  if (adopted.length) lines.push(`${CMD} matrix-build --cells ${[...new Set(adopted)].join(",")}`);
  copy(lines.join("\n"), "採用コマンド");
};
window.addEventListener("beforeunload", e => { if (S && isDirty()) { e.preventDefault(); e.returnValue = ""; } });
load();
</script>
</body>
</html>
